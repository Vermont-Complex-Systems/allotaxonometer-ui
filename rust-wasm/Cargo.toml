[package]
name = "allotaxonometer-wasm"
version = "0.1.0"
edition = "2021"
authors = ["Jonathan St-Onge <jonathanstonge7@gmail.com>"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
allotax-core = "0.2.0"
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = 3
lto = true
